[project]
name = "psauci-ds-v2-5-3-4-1"
version = "0.1.0"
description = "Analysis of Home Credit Default Risk"
authors = [
    {name = "Povilas",email = "p.sauciuvienas@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas (>=2.3.0,<3.0.0)",
    "scikit-learn (>=1.7.0,<2.0.0)",
    "duck (>=0.1,<0.2)",
    "db (>=0.1.1,<0.2.0)",
    "ipykernel (>=6.29.5,<7.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "matplotlib (>=3.10.3,<4.0.0)",
    "statsmodels (>=0.14.4,<0.15.0)"
]

[tool.poetry]
packages = [{include = "psauci_ds"}]


[tool.poetry.group.dev.dependencies]
ipykernel = "^6.29.5"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
