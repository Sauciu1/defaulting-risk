[tool.poetry]
name = "psauci-ds-v2-5-3-4-1"
version = "0.1.0"
description = "Analysis of Home Credit Default Risk"
authors = ["Povilas <p.sauciuvienas@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
pandas = ">=2.3.0,<3.0.0"
scikit-learn = "1.6.1"
duck = ">=0.1,<0.2"
db = ">=0.1.1,<0.2.0"
ipykernel = ">=6.29.5,<7.0.0"
statsmodels = ">=0.14.4,<0.15.0"
lightgbm = ">=4.6.0,<5.0.0"
hdbscan = ">=0.8.40,<0.9.0"
cuda-python = ">=12.9.0,<13.0.0"
keras = ">=3.10.0,<4.0.0"
networkx = ">=3.5,<4.0"
shap = ">=0.48.0,<0.49.0"
imbalanced-learn = ">=0.12.0,<0.13.0"
xgboost = ">=2.0.0,<3.0.0"
flask = ">=2.0.0,<3.0.0"
requests = ">=2.25.0,<3.0.0"
joblib = ">=1.0.0,<2.0.0"
seaborn = "^0.13.2"
plotly = "^6.2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"